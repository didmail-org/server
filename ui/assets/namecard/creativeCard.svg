<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 500">
  <title>Creative — coral studio</title>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#fffaf1"/><stop offset="1" stop-color="#efdfd5"/>
    </linearGradient>
    <linearGradient id="coral" x2="1" y2="1">
      <stop stop-color="#ffae8a"/><stop offset=".5" stop-color="#ef7058"/><stop offset="1" stop-color="#be4558"/>
    </linearGradient>
    <radialGradient id="sphere" cx=".28" cy=".22" r=".85">
      <stop stop-color="#fff4ff"/><stop offset=".4" stop-color="#d9c4f0"/><stop offset="1" stop-color="#8b6aa8"/>
    </radialGradient>
    <radialGradient id="sphereShadow">
      <stop stop-color="#69273e" stop-opacity=".42"/><stop offset="1" stop-color="#69273e" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="800" height="500" rx="20"/></clipPath>
    <clipPath id="company"><rect x="44" y="38" width="465" height="36"/></clipPath>
    <clipPath id="name"><rect x="44" y="152" width="465" height="68"/></clipPath>
    <clipPath id="role"><rect x="44" y="234" width="465" height="32"/></clipPath>
    <clipPath id="phone"><rect x="44" y="337" width="465" height="30"/></clipPath>
    <clipPath id="email"><rect x="44" y="379" width="465" height="30"/></clipPath>
    <clipPath id="website"><rect x="44" y="441" width="465" height="30"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="800" height="500" fill="url(#paper)"/>
    <rect x="548" width="252" height="500" fill="url(#coral)"/>
    <ellipse cx="690" cy="278" rx="98" ry="27" fill="url(#sphereShadow)"/>
    <circle cx="674" cy="194" r="83" fill="url(#sphere)"/>
    <path d="M588 294c0-46 38-84 84-84s84 38 84 84-38 84-84 84-84-38-84-84Z" fill="none" stroke="#342b36" stroke-width="2"/>
    <path d="M588 294h168m-84-84v168" stroke="#342b36" stroke-width="2"/>
    <rect x="728" y="44" width="28" height="28" fill="#342b36"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#342b36">
    <text x="44" y="65" font-size="17" font-weight="600" clip-path="url(#company)">{{contact.company}}</text>
    <path d="M44 112h56" stroke="#ef7058" stroke-width="5"/>
    <text x="44" y="204" font-size="40" font-weight="800" letter-spacing="-1.5" clip-path="url(#name)">{{contact.name}}</text>
    <text x="44" y="257" font-size="20" clip-path="url(#role)">{{contact.position}}</text>
    <text x="44" y="359" font-size="18" clip-path="url(#phone)">{{contact.phone}}</text>
    <text x="44" y="401" font-size="18" clip-path="url(#email)">{{contact.email}}</text>
    <text x="44" y="462" font-size="16" clip-path="url(#website)">{{contact.website}}</text>
    <text x="674" y="458" text-anchor="middle" font-size="10" letter-spacing="3">DIDMAIL</text>
  </g>
</svg>
