<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 500">
  <title>Executive — navy and brass</title>
  <defs>
    <linearGradient id="navy" x2="1" y2="1">
      <stop stop-color="#30465f"/><stop offset=".48" stop-color="#172b43"/><stop offset="1" stop-color="#0b1525"/>
    </linearGradient>
    <radialGradient id="spotlight" cx=".83" cy=".08" r=".8">
      <stop stop-color="#d8bc88" stop-opacity=".2"/><stop offset="1" stop-color="#d8bc88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x2="1" y2=".6">
      <stop stop-color="#a3834b"/><stop offset=".45" stop-color="#f5e0ad"/><stop offset="1" stop-color="#bc975b"/>
    </linearGradient>
    <clipPath id="company"><rect x="48" y="44" width="620" height="34"/></clipPath>
    <clipPath id="name"><rect x="48" y="155" width="704" height="70"/></clipPath>
    <clipPath id="role"><rect x="48" y="232" width="704" height="34"/></clipPath>
    <clipPath id="phone"><rect x="48" y="351" width="330" height="32"/></clipPath>
    <clipPath id="email"><rect x="418" y="351" width="334" height="32"/></clipPath>
    <clipPath id="website"><rect x="48" y="431" width="610" height="30"/></clipPath>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#navy)"/>
  <rect width="800" height="500" rx="20" fill="url(#spotlight)"/>
  <rect x="1" y="1" width="798" height="498" rx="19" fill="none" stroke="#e3cc9c" stroke-opacity=".16"/>
  <path d="M48 114h36" stroke="url(#brass)" stroke-width="3"/>
  <path d="M700 48v28m12-28v28m12-28v28" stroke="url(#brass)" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="70" font-size="20" fill="#d8bc88" clip-path="url(#company)">{{contact.company}}</text>
    <text x="48" y="209" font-size="48" font-weight="600" letter-spacing="-1" fill="#f8f4ec" clip-path="url(#name)">{{contact.name}}</text>
    <text x="48" y="257" font-size="21" fill="#b9c5d3" clip-path="url(#role)">{{contact.position}}</text>
    <path d="M48 305h704" stroke="#3b4a5c"/>
    <text x="48" y="338" font-size="10" letter-spacing="2" fill="#d8bc88">PHONE</text>
    <text x="418" y="338" font-size="10" letter-spacing="2" fill="#d8bc88">EMAIL</text>
    <text x="48" y="375" font-size="19" fill="#f8f4ec" clip-path="url(#phone)">{{contact.phone}}</text>
    <text x="418" y="375" font-size="19" fill="#f8f4ec" clip-path="url(#email)">{{contact.email}}</text>
    <text x="48" y="452" font-size="17" fill="#b9c5d3" clip-path="url(#website)">{{contact.website}}</text>
    <text x="752" y="452" text-anchor="end" font-size="10" letter-spacing="2" fill="#d8bc88">DIDMAIL</text>
  </g>
</svg>
