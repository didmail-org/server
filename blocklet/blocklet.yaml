specVersion: 2
id: didmail-server
name: DIDMail Server
did: did:blocklet:didmail-server
version: 0.1.0
description: Decentralized encrypted mail with the original REST API and native AUP Web Device UI
logo: web/logo.svg
license: Apache-2.0
save: false
scope: app
instance:
  required: true
  mount: /instance
sites:
  - name: didmail-server
    domains: ["didmail-server.localhost"]
mounts:
  - target: ./providers/didmail
    path: /didmail
    required: true
    ops: [list, read, stat, explain]
