        path: /admin/envelope
        redirect: /admin-envelope/
      - id: admin-namecard
        path: /admin/namecard
        redirect: /admin-namecard/
      - id: admin-storage
        path: /admin/storage
        redirect: /admin-storage/
      - id: admin-attachment
        path: /admin/attachment
        redirect: /admin-attachment/
      - id: admin-members
        path: /admin/members
        redirect: /admin-members/
