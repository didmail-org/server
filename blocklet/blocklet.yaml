specVersion: 2
id: didmail-server
name: DIDMail Server
did: did:blocklet:didmail-server
version: 0.1.0
description: Decentralized encrypted mail with the original REST API and native AUP Web Device UI
author:
  name: DIDMail
keywords: [didmail, encrypted-mail, did, arc]
homepage: https://didmail.org
documentation: https://github.com/didmail-org/server/blob/main/docs/local-arc-development.md
repository:
  type: git
  url: https://github.com/didmail-org/server.git
support: https://github.com/didmail-org/server/issues
logo: assets/logo.svg
license: Apache-2.0
save: false
scope: app
instance:
  required: true
  mount: /instance
sites:
  - name: didmail-server
    domains: ["didmail-server.localhost"]
    bindings:
      - id: admin-account
        path: /admin/account
        redirect: /admin-account/
      - id: admin-server
        path: /admin/server
        redirect: /admin-server/
