mounts:
  - target: ./providers/didmail-http
    path: /didmail-http
    required: true
    ops: [list, read, stat, explain, exec]
  - target: ./providers/didmail-business
    path: /didmail-business
    required: true
    ops: [list, read, stat, explain, exec]
  - target: ./providers/didmail-native
    path: /didmail-native
    required: true
    ops: [list, read, stat, explain, exec]
  - target: ./providers/didmail
    path: /didmail
    required: true
    ops: [list, read, stat, explain]
networkRead:
